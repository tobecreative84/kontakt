<style>
  :root {
    --bg: #171923;
    --blue: #3d5bb0;
    --blue-hover: #4a69c2;
    --text: #ffffff;
    --text-soft: #d9dce8;
    --line: #2a2e3d;
    --font: "Nunito Sans", "Avenir Next", Avenir, system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .card { max-width: 520px; margin: 0 auto; padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }

  .hero { position: relative; overflow: hidden; border-radius: 0 0 0 0; }
  .hero img.foto { display: block; width: 100%; aspect-ratio: 1320 / 1076; object-fit: cover; }
  .hero svg { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: auto; display: block; }
  .logo { position: absolute; right: 7%; bottom: 3%; width: 17%; max-width: 110px; }

  .who { display: flex; gap: 18px; padding: 28px max(24px, env(safe-area-inset-right, 0px)) 8px max(24px, env(safe-area-inset-left, 0px)); }
  .who::before { content: ""; flex: none; width: 0; border-left: 2px dotted #8a90a6; margin: 4px 0; }
  h1 { margin: 0; font-size: clamp(30px, 8.5vw, 40px); font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
  .rolle { margin: 6px 0 0; font-size: clamp(17px, 4.6vw, 21px); font-style: italic; color: var(--text-soft); line-height: 1.35; }

  .links { list-style: none; margin: 28px 0 0; padding: 0 max(24px, env(safe-area-inset-right, 0px)) 0 max(24px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
  .links a { display: flex; align-items: center; gap: 18px; color: var(--text); text-decoration: none; font-size: clamp(17px, 4.6vw, 20px); padding: 2px 0; border-radius: 40px; }
  .links a:focus-visible { outline: 2px solid var(--blue-hover); outline-offset: 4px; }
  .icon { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; transition: background .15s; }
  .links a:hover .icon { background: var(--blue-hover); }
  .icon svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .links span.txt { min-width: 0; overflow-wrap: anywhere; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
         padding: 14px max(20px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
  .save { display: flex; align-items: center; justify-content: center; gap: 12px; max-width: 480px; margin: 0 auto; height: 60px; border-radius: 14px;
          background: var(--blue); color: #fff; text-decoration: none; font-weight: 800; font-size: 19px; letter-spacing: 0.04em; text-transform: uppercase;
          border: 1.5px solid #5a75c9; transition: background .15s, transform .1s; }
  .save:hover { background: var(--blue-hover); }
  .save:active { transform: scale(0.98); }
  .save:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .save svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
